apiVersion: v1
kind: Service
metadata:
  name: hive-server-jdbc
  namespace: data
spec:
  type: LoadBalancer
  selector:
    app: hive-server
  ports:
    - name: hiveserver2
      port: 10000
      targetPort: hiveserver2
---
apiVersion: v1
kind: Service
metadata:
  name: trino-jdbc
  namespace: data
spec:
  type: LoadBalancer
  selector:
    app: trino
  ports:
    - name: jdbc
      port: 18089
      targetPort: http
