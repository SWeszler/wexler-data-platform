apiVersion: batch/v1
kind: Job
metadata:
  name: kfp-minio-init
  namespace: kubeflow
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-client
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mc alias set platform http://minio.data.svc.cluster.local:9000 "$ACCESS_KEY" "$SECRET_KEY"
              mc mb --ignore-existing platform/kfp-artifacts
              mc stat platform/kfp-artifacts
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlpipeline-minio-artifact
                  key: accesskey
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mlpipeline-minio-artifact
                  key: secretkey
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubeflow-pipelines
  namespace: kubeflow
spec:
  ingressClassName: nginx
  rules:
    - host: pipelines.wexler.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ml-pipeline-ui
                port:
                  number: 80
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kfp-spark-launcher
  namespace: spark
rules:
  - apiGroups:
      - sparkoperator.k8s.io
    resources:
      - sparkapplications
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kfp-spark-launcher
  namespace: spark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kfp-spark-launcher
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: kubeflow
