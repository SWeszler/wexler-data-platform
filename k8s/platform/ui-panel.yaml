apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-panel-links
  namespace: platform
data:
  BROWSER_LINKS_JSON: |
    [
      {
        "name": "MinIO Console",
        "url": "http://minio.wexler.test",
        "description": "Browse buckets and upload input files."
      },
      {
        "name": "Trino UI",
        "url": "http://trino.wexler.test/ui/",
        "description": "Inspect Trino coordinator, running queries, and query history."
      },
      {
        "name": "Spark History Server",
        "url": "http://spark-history.wexler.test",
        "description": "View completed Spark applications from MinIO event logs."
      },
      {
        "name": "UI Panel",
        "url": "http://panel.wexler.test",
        "description": "Open this launcher through Ingress."
      }
    ]
  DATAGRIP_LINKS_JSON: |
    [
      {
        "name": "Hive",
        "value": "jdbc:hive2://localhost:10000/default;auth=noSasl",
        "command": "kubectl port-forward deployment/hive-server --address localhost 10000:10000 -n data"
      },
      {
        "name": "Trino",
        "value": "jdbc:trino://localhost:8089/hive/default",
        "command": "kubectl port-forward -n data svc/trino 8089:8080"
      }
    ]
  S3_PATHS_JSON: |
    [
      {
        "name": "Input logs",
        "value": "s3a://logs/web_server_logs.txt"
      },
      {
        "name": "Spark warehouse",
        "value": "s3a://warehouse/spark-warehouse"
      },
      {
        "name": "Hive warehouse",
        "value": "s3a://warehouse/hive"
      },
      {
        "name": "Spark event logs",
        "value": "s3a://warehouse/spark-events"
      },
      {
        "name": "Log analyzer output",
        "value": "s3a://warehouse/output/sessionization"
      }
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-panel
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-panel
  template:
    metadata:
      labels:
        app: ui-panel
    spec:
      containers:
        - name: ui-panel
          image: wexler-ui-panel:ingress-first
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: ui-panel-links
          env:
            - name: PUBLIC_HOST
              value: localhost
            - name: PANEL_PORT
              value: "8501"
            - name: MINIO_CONSOLE_PORT
              value: "9001"
            - name: SPARK_HISTORY_PORT
              value: "18080"
            - name: TRINO_PORT
              value: "8089"
            - name: HIVE_PORT
              value: "10000"
            - name: SPARK_UI_PORT
              value: "4040"
            - name: MINIO_INGRESS_URL
              value: http://minio.wexler.test
            - name: TRINO_INGRESS_URL
              value: http://trino.wexler.test/ui/
            - name: SPARK_HISTORY_INGRESS_URL
              value: http://spark-history.wexler.test
            - name: PANEL_INGRESS_URL
              value: http://panel.wexler.test
          ports:
            - name: http
              containerPort: 8501
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ui-panel
  namespace: platform
spec:
  selector:
    app: ui-panel
  ports:
    - name: http
      port: 8501
      targetPort: http
