apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafbat-ui
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafbat-ui
  template:
    metadata:
      labels:
        app: kafbat-ui
    spec:
      containers:
        - name: kafbat-ui
          image: ghcr.io/kafbat/kafka-ui:latest
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: wexler-kafka
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: wexler-kafka-kafka-bootstrap.data.svc.cluster.local:9092
            - name: DYNAMIC_CONFIG_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafbat-ui
  namespace: platform
spec:
  selector:
    app: kafbat-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
