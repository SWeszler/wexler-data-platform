---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ui-panel
  namespace: platform
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: 127.0.0.1/32,::1/128
spec:
  ingressClassName: nginx
  rules:
    - host: panel.wexler.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui-panel
                port:
                  number: 8501
