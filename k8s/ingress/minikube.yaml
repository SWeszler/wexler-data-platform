---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ui-panel
  namespace: platform
spec:
  # Local Minikube only. Docker-driver ingress can present browser traffic as a
  # cluster bridge IP instead of 127.0.0.1, so a loopback whitelist causes 403s.
  ingressClassName: nginx
  rules:
    - host: panel.wexler.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui-panel
                port:
                  number: 8501
